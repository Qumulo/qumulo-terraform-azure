  # Deploying Cloud Native Qumulo (CNQ) on Azure with Terraform
  This repository contains Terraform which deploys a resource group, storage accounts, managed identities, and a CNQ cluster with 1 or 3+ node VMs.
  This Terraform uses the Qumulo Azure Provider.  This greatly simplifies Terraform operations and makes compute elasticity changes even more elegant.  To learn more about the provider read the [provider docs](https://qumulo.github.io/terraform-provider-qumulo-cloud/).

  ## Configure Terraform backend.tf
  This Terraform defaults to store state on Azure Blob Storage.  As such the ./backend.tf must be configured with the storage account, resource group, and container you choose to store state in.
  Note you can't put variables in the backend.tf config, which is why this note is here. If you call this Terraform as a module the backend.tf will be ignored.

  ## Getting Started with Cloud Native Qumulo (CNQ)
  For an overview of CNQ and the provider's full resource schema, see the [Qumulo Terraform Provider documentation](https://qumulo.github.io/terraform-provider-qumulo-cloud/).

  > ✅ **Tip:** For help with deployment, configuration, updates, scaling out your cluster, and best practices for high performance, [message us on Slack](https://docs.qumulo.com/contacting-qumulo-care-team.html).


